name = "rental-hunt"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
REPO = "DOli4/rental-hunt"
BRANCH = "data"
ALLOWED_ORIGIN = "https://doli4.github.io"

# Caps save attempts per visitor (optional; the worker skips it if this binding is missing)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (never put them here): npx wrangler secret put GITHUB_TOKEN / PASSCODE
